x-constants:
  backend_host: &backend_host localhost
  backend_port: &backend_port 5000

services:

  db:
    image: mysql:8.0
    container_name: geocontrol-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: geocontrol_db
      MYSQL_USER: geocontrol_user
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/db/my-custom.cnf:/etc/mysql/conf.d/my-custom.cnf:ro
      - ./docker/db/mysql-safe:/var/run/mysql-safe:rw
    command: --pid-file=/var/run/mysql-safe/mysqld.pid

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: geocontrol-backend
    ports:
      - "5000:5000"
    depends_on:
      - db
    env_file:
      - ./backend/.env
    restart: on-failure
    command: sh -c "echo 'Waiting for MySQL...'; sleep 5; echo 'Creating root user...'; npm run create-root || echo 'create-root failed'; echo 'Starting backend...'; npm start"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/doc"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  frontend:
    image: smpolito/geocontrolui:latest
    container_name: geocontrol-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173" 
    volumes: 
      - ./frontend/env-vars.json:/app/dist/config.json 

